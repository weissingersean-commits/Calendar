const getEventMinutes=ev=>{const minutes=(ev.minute||0);return ev.hour*60+minutes;};
const buildEventColumns=events=>{
  const evs=events.map(ev=>({
    ...ev,
    start:getEventMinutes(ev),
    end:getEventMinutes(ev)+Math.round(ev.duration*60)
  })).sort((a,b)=>a.start-b.start||a.end-b.end);
  const groups=[];
  let current=null;
  for(const ev of evs){
    if(!current||ev.start>=current.end){
      current={events:[ev],end:ev.end};groups.push(current);
    } else {
      current.events.push(ev);if(ev.end>current.end)current.end=ev.end;
    }
  }
  const layout=new Map();
  groups.forEach(group=>{
    const cols=[];
    group.events.forEach(ev=>{
      let placed=false;
      for(let ci=0;ci<cols.length;ci++){
        const col=cols[ci];
        if(col[col.length-1].end<=ev.start){col.push(ev);layout.set(ev.id,{col:ci,total:undefined});placed=true;break;}
      }
      if(!placed){cols.push([ev]);layout.set(ev.id,{col:cols.length-1,total:undefined});}
    });
    const total=cols.length;
    cols.forEach((col,ci)=>col.forEach(ev=>layout.set(ev.id,{col:ci,total})));

};

function useP(key,def){

// ─── ICS Parser ──────────────────────────────────────────────────────
function normalizeFeedUrl(url){if(!url)return url;let clean=url.trim();if(clean.startsWith("webcal://"))clean=`https://${clean.slice(9)}`;if(clean.startsWith("http://"))clean=`https://${clean.slice(7)}`;return clean;}
function parseICS(text,feedId,feedColor){
  const evs=[];const lines=text.replace(/\r\n[ \t]/g,"").replace(/\r/g,"").split("\n");let ev=null;
  for(const raw of lines){const line=raw.trim();
    if(line==="BEGIN:VEVENT"){ev={};continue;}
    if(line==="END:VEVENT"){if(ev)evs.push(ev);ev=null;continue;}
    if(!ev)continue;const ci=line.indexOf(":");if(ci<0)continue;
    const kp=line.slice(0,ci),val=line.slice(ci+1);const parts=kp.split(";");const bk=parts[0];const params=parts.slice(1).reduce((acc,p)=>{const [k,v]=p.split("=");if(k&&v)acc[k.toUpperCase()]=v;return acc;},{ });
    if(bk==="SUMMARY")ev.summary=val.replace(/\\,/g,",").replace(/\\n/g," ").replace(/\\;/g,";");
    else if(bk==="DTSTART"){ev.dtstart=val;ev.allDay=params.VALUE==="DATE";}
    else if(bk==="DTEND"){ev.dtend=val;ev.endAllDay=params.VALUE==="DATE";}
    else if(bk==="DURATION")ev.duration=val;
    else if(bk==="RRULE")ev.rrule=val;
    else if(bk==="EXDATE")ev.exdate=(ev.exdate||[]).concat(val.split(",").map(v=>v.trim()));
    else if(bk==="LOCATION")ev.location=val.replace(/\\,/g,",");
    else if(bk==="UID")ev.uid=val;
  }
  return evs.flatMap(e=>{const st=parseICSDate(e.dtstart);if(!st)return[];const allDay=!!e.allDay||(e.dtstart?.length===8);const durationMs=calcEventDuration(e,st,allDay);const exdates=(e.exdate||[]).map(parseICSDate).filter(Boolean).map(d=>d.toISOString());return e.rrule?expandRecurrences(e,st,durationMs,exdates,feedId,feedColor,allDay):[buildParsedICSItem(st,durationMs,e,feedId,feedColor,allDay)];}).filter(Boolean);
}
function parseICSDate(s){if(!s)return null;const m=s.match(/^(\d{8})(?:T(\d{6})(Z)?)?$/);if(!m)return null;const year=+m[1].slice(0,4),month=+m[1].slice(4,6)-1,day=+m[1].slice(6,8);if(!m[2])return new Date(year,month,day);const hour=+m[2].slice(0,2),minute=+m[2].slice(2,4),second=+m[2].slice(4,6);return m[3]?new Date(Date.UTC(year,month,day,hour,minute,second)):new Date(year,month,day,hour,minute,second);}
function calcEventDuration(e,st,allDay){
  if(e.dtend){const en=parseICSDate(e.dtend);if(en)return Math.max(60000,en.getTime()-st.getTime());}
  if(e.duration){const m=e.duration.match(/P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?/);if(m)return ((+m[1]||0)*24+(+m[2]||0))*3600000+((+m[3]||0)*60000);}
  return allDay?86400000:3600000;
}
function buildParsedICSItem(start,durationMs,e,feedId,feedColor,allDay){
  const dateKey=dkey(start);const hour=allDay?0:start.getHours();const minute=allDay?0:start.getMinutes();
  return{id:`ical-${feedId}-${e.uid||mkId()}-${dateKey}-${hour}-${minute}`,title:e.summary||"Untitled",date:dateKey,hour,minute,duration:Math.min(12,Math.max(0.25,durationMs/3600000)),category:"synced",feedId,feedColor,location:e.location||"",synced:true};
}
const WEEKDAY_MAP={SU:0,MO:1,TU:2,WE:3,TH:4,FR:5,SA:6};
function parseRRule(rule){return rule.split(";").reduce((acc,p)=>{const [k,v]=p.split("=");if(k&&v)acc[k.toUpperCase()]=v;return acc;},{ });}
function expandRecurrences(e,start,durationMs,exdates,feedId,feedColor,allDay){
  const rule=parseRRule(e.rrule||"");if(!rule.FREQ)return[buildParsedICSItem(start,durationMs,e,feedId,feedColor,allDay)];
  const now=new Date();const windowStart=addD(now,-30);const windowEnd=addD(now,180);
  const until=rule.UNTIL?parseICSDate(rule.UNTIL):null;const maxEnd=until&&until<windowEnd?until:windowEnd;
  const maxCount=rule.COUNT?Math.min(500,parseInt(rule.COUNT,10)||500):500;
  const occurrences=[];let current=new Date(start);let count=0;
  while(current<=maxEnd&&count<maxCount){
    if(current>=windowStart&&!exdates.includes(current.toISOString()))occurrences.push(new Date(current));
    const next=nextRecurrence(current,rule,start);if(!next||next.getTime()===current.getTime())break;current=next;count++;}
  return occurrences.length?occurrences.map(dt=>buildParsedICSItem(dt,durationMs,e,feedId,feedColor,allDay)):[buildParsedICSItem(start,durationMs,e,feedId,feedColor,allDay)];
}
function nextRecurrence(date,rule,original){const freq=rule.FREQ;const interval=Math.max(1,parseInt(rule.INTERVAL,10)||1);
  if(freq==="DAILY")return addD(date,interval);
  if(freq==="WEEKLY"){const days=rule.BYDAY?rule.BYDAY.split(",").map(d=>WEEKDAY_MAP[d]).filter(n=>n!==undefined).sort((a,b)=>a-b):null; if(days&&days.length){const today=date.getDay();const later=days.find(d=>d>today);return later!==undefined?setWeekday(date,later):setWeekday(addD(date,7*interval),days[0]);}return addD(date,7*interval);}
  if(freq==="MONTHLY"){const day=rule.BYMONTHDAY?parseInt(rule.BYMONTHDAY.split(",")[0],10):original.getDate();const next=new Date(date);next.setMonth(next.getMonth()+interval);next.setDate(day);if(next.getDate()!==day)next.setDate(0);return next;}
  if(freq==="YEARLY"){const next=new Date(date);next.setFullYear(next.getFullYear()+interval);return next;}
  return null;
}
function setWeekday(date,weekday){const next=new Date(date);const diff=weekday-next.getDay();next.setDate(next.getDate()+((diff>=0?diff:diff+7)));return next;}
async function fetchWithCorsFallback(url){
  try{const r=await fetch(url);if(r.ok)return await r.text();throw new Error(`HTTP ${r.status}`);}catch(err){
    if(url.includes("corsproxy.io/?"))throw err;
    const proxy=`https://corsproxy.io/?${encodeURIComponent(url)}`;
    const r2=await fetch(proxy);if(r2.ok)return await r2.text();throw new Error(`Proxy ${r2.status}`);
  }
}
function eventToICS(ev){
  const start=new Date(`${ev.date}T${String(ev.hour).padStart(2,"0")}:${String(ev.minute||0).padStart(2,"0")}:00`);
  const end=new Date(start.getTime()+ev.duration*3600000);
  const fmtDate=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}T${String(d.getHours()).padStart(2,"0")}${String(d.getMinutes()).padStart(2,"0")}00`;
  return`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Homelight//EN\r\nBEGIN:VEVENT\r\nDTSTART:${fmtDate(start)}\r\nDTEND:${fmtDate(end)}\r\nSUMMARY:${ev.title}\r\n${ev.location?`LOCATION:${ev.location}\r\n`:""}UID:${ev.id}@homelight\r\nEND:VEVENT\r\nEND:VCALENDAR`;
}

// ═════════════════ WEATHER ════════════════════════════════════════════
function Weather({loc,setLoc}){
  const t=useT(),s=useS();
  const[wx,setWx]=useState(null),[fc,setFc]=useState([]),[ld,setLd]=useState(true),[open,setOpen]=useState(false);
  const[q,setQ]=useState(""),[res,setRes]=useState([]),[srch,setSrch]=useState(false),[gErr,setGErr]=useState(null);
  const[useF,setUseF]=useP("unit",true);
  const fetchWx=useCallback(async(lat,lon)=>{try{setLd(true);const u=useF?"fahrenheit":"celsius";const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=${u}&wind_speed_unit=mph&timezone=auto&forecast_days=7`);const d=await r.json();if(d.current)setWx({temp:Math.round(d.current.temperature_2m),feels:Math.round(d.current.apparent_temperature),hum:d.current.relative_humidity_2m,wind:Math.round(d.current.wind_speed_10m),code:d.current.weather_code});if(d.daily)setFc(d.daily.time.slice(1,6).map((x,i)=>({date:x,hi:Math.round(d.daily.temperature_2m_max[i+1]),lo:Math.round(d.daily.temperature_2m_min[i+1]),code:d.daily.weather_code[i+1],prec:d.daily.precipitation_probability_max[i+1]})));}catch(e){console.error(e);}finally{setLd(false);}
  },[useF]);
  const detectViaIP=useCallback(async()=>{try{const r=await fetch("https://ipapi.co/json/");const d=await r.json();if(d.latitude&&d.longitude){setLoc({name:`${d.city||"My Location"}${d.region?", "+d.region:""}${d.country_name?` · ${d.country_name}`:""}`,lat:d.latitude,lon:d.longitude});setGErr(null);return;}}catch(e){console.error(e);}setGErr("Unable to auto-detect location. Please search manually.");},[setLoc]);

  useEffect(()=>{if(loc?.lat)fetchWx(loc.lat,loc.lon);},[loc,fetchWx]);
  useEffect(()=>{if(!loc)detect();},[]);
  const search=async()=>{if(q.length<2)return;setSrch(true);try{const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=en`);const d=await r.json();setRes(d.results||[]);}catch{setRes([]);}finally{setSrch(false);}};
  const unit=useF?"°F":"°C",info=wx?wmo(wx.code):null;
  return(<div>

// ═════════════════ CAL SYNC PANEL ════════════════════════════════════
function CalSyncPanel({feeds,setFeeds,syncAll,syncStatus}){

      <button onClick={()=>toggleFeed(f.id)} style={{background:"none",border:"none",color:f.enabled?t.accent:t.dim,cursor:"pointer",fontSize:14}}>{f.enabled?"On":"Off"}</button>

    </div>)}

    :<button onClick={()=>setShowAdd(true)} style={{width:"100%",padding:"10px 0",borderRadius:10,border:`1px dashed ${t.bdr}`,background:"transparent",color:t.accent,fontSize:12,fontWeight:600,cursor:"pointer",marginBottom:12}}>+ Add Calendar Feed</button>}
    {feeds.length>0&&<button onClick={syncAll} style={{width:"100%",padding:"10px 0",borderRadius:10,border:"none",background:t.accent,color:t.acText,fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:FF,marginBottom:14}}>{syncStatus==="loading"?"Syncing...":"Sync All Now"}</button>}
    {syncStatus==="error"&&<div style={{fontSize:12,color:t.danger,marginBottom:10}}>Some feeds failed — check URLs or try a CORS proxy.</div>}
    <div style={s.crd}><div style={{fontSize:11,fontWeight:700,color:t.text,marginBottom:8}}>📱 Google Calendar</div><div style={{fontSize:11,color:t.sub,lineHeight:1.6}}>Use your calendar's secret iCal address: Settings ⚙ → Your calendar → "Integrate calendar" → Copy "Secret address in iCal format".</div></div>
    <div style={s.crd}><div style={{fontSize:11,fontWeight:700,color:t.text,marginBottom:8}}>🍎 iPhone / iCloud</div><div style={{fontSize:11,color:t.sub,lineHeight:1.6}}>On iCloud calendar, share the calendar as public and copy the URL. If it starts with <code style={{fontSize:10,color:t.accent,background:t.acDim,padding:"2px 6px",borderRadius:4}}>webcal://</code>, Homelight will convert it to <code style={{fontSize:10,color:t.accent,background:t.acDim,padding:"2px 6px",borderRadius:4}}>https://</code> automatically.</div></div>
    <div style={s.crd}><div style={{fontSize:11,fontWeight:700,color:t.text,marginBottom:8}}>⚠️ CORS Proxy</div><div style={{fontSize:11,color:t.sub,lineHeight:1.6}}>If a feed won't load, prepend: <code style={{fontSize:10,color:t.accent,background:t.acDim,padding:"2px 6px",borderRadius:4}}>https://corsproxy.io/?</code></div></div>
  </div>;

// ═════════════════ MAIN APP ═════════════════════════════════════════
function Homelight(){
  const[theme,setTheme]=useP("theme","dark");const t=THEMES[theme]||THEMES.dark;
  const[view,setView]=useP("view","month"),[sel,setSel]=useState(new Date());
  const[events,setEvents]=useP("events",[]);
  const[todos,setTodos]=useP("todos",[]);
  const[grocery,setGrocery]=useP("grocery",[]);
  const[meals,setMeals]=useP("meals",{});

  const[modal,setModal]=useState(null),[showSS,setShowSS]=useState(false);
  const[sideTab,setSideTab]=useState("tasks"),[panel,setPanel]=useState("main");
  const[time,setTime]=useState(new Date()),[ssDelay,setSsDelay]=useP("ssDelay",0);
  const[feeds,setFeeds]=useP("feeds",[]),[syncStatus,setSyncStatus]=useState(null);
  const[photos,setPhotos]=useP("photos",[]);
  const lastAct=useRef(Date.now());

  useEffect(()=>{const i=setInterval(()=>setTime(new Date()),15000);return()=>clearInterval(i);},[]);
  useEffect(()=>{if(!loc)return;(async()=>{try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=auto`);const d=await r.json();if(d.current)setWx({temp:Math.round(d.current.temperature_2m),code:d.current.weather_code});}catch{}})();},[loc]);
  useEffect(()=>{if(!ssDelay)return;const h=()=>{lastAct.current=Date.now();};window.addEventListener("mousemove",h);window.addEventListener("touchstart",h);window.addEventListener("keydown",h);const ck=setInterval(()=>{if(Date.now()-lastAct.current>ssDelay*60000&&!showSS)setShowSS(true);},10000);return()=>{window.removeEventListener("mousemove",h);window.removeEventListener("touchstart",h);window.removeEventListener("keydown",h);clearInterval(ck);};},[ssDelay,showSS]);

  const syncFeed=useCallback(async feed=>{try{const url=normalizeFeedUrl(feed.url);const text=await fetchWithCorsFallback(url);const parsed=parseICS(text,feed.id,feed.color);setEvents(prev=>[...prev.filter(e=>e.feedId!==feed.id),...parsed]);setFeeds(prev=>prev.map(f=>f.id===feed.id?{...f,url, lastSync:Date.now(),count:parsed.length,error:null}:f));return true;}catch(err){const message=err?.message||"Failed to load feed";setFeeds(prev=>prev.map(f=>f.id===feed.id?{...f,count:0,error:message}:f));return false;}},[setEvents,setFeeds]);
  const syncAll=useCallback(async(feedToSync)=>{setSyncStatus("loading");
    if(feedToSync){const success=await syncFeed(feedToSync);setSyncStatus(success?"success":"error");return;}
    const results=await Promise.all(feeds.filter(f=>f.enabled).map(syncFeed));setSyncStatus(results.every(Boolean)?"success":"error");},[feeds,syncFeed]);
  useEffect(()=>{if(feeds.length===0)return;syncAll();const i=setInterval(syncAll,900000);return()=>clearInterval(i);},[feeds.length]);

  const saveEvent=useCallback(ev=>{setEvents(prev=>{const idx=prev.findIndex(e=>e.id===ev.id);if(idx>=0){const n=[...prev];n[idx]=ev;return n;}return[...prev,ev];});},[setEvents]);

  const visibleEvents=useMemo(()=>{const dis=new Set(feeds.filter(f=>!f.enabled).map(f=>f.id));return events.filter(e=>!e.feedId||!dis.has(e.feedId));},[events,feeds]);

  if(showSS)return<Screensaver onTap={()=>{setShowSS(false);lastAct.current=Date.now();}} wx={wx} loc={loc} customPhotos={photos}/>;

  return<ThemeCtx.Provider value={t}>
    <div style={{fontFamily:FF,height:"100vh",width:"100vw",background:t.grad,color:t.text,display:"flex",flexDirection:"column",overflow:"hidden",userSelect:"none"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 20px",borderBottom:`1px solid ${t.bdr}`,background:t.headerBg,backdropFilter:"blur(24px)",flexShrink:0,zIndex:10}}>
        <div style={{display:"flex",alignItems:"center",gap:16}}>
          <span style={{fontSize:16,fontWeight:700,letterSpacing:3,color:t.accent,textTransform:"uppercase",fontFamily:FM}}>☀ Homelight</span>
          <div style={{display:"flex",gap:2,background:t.card,borderRadius:24,padding:3}}>{["day","week","month"].map(v=><button key={v} onClick={()=>setView(v)} style={{padding:"6px 16px",borderRadius:22,border:"none",background:view===v?t.accent:"transparent",color:view===v?t.acText:t.sub,fontSize:11,fontWeight:view===v?700:500,cursor:"pointer",textTransform:"uppercase",letterSpacing:1,fontFamily:FF,transition:"all 0.2s"}}>{v}</button>)}</div>

            <div style={{padding:"8px 16px",borderTop:`1px solid ${t.bdr}`,display:"flex",flexWrap:"wrap",gap:8}}>
              {Object.entries(CATS).map(([cat,col])=><div key={cat} style={{display:"flex",alignItems:"center",gap:4}}><div style={{width:7,height:7,borderRadius:"50%",background:col.bg}}/><span style={{fontSize:9,color:t.dim,textTransform:"capitalize"}}>{cat}</span></div>)}
              {feeds.filter(f=>f.enabled).map(f=><div key={f.id} style={{display:"flex",alignItems:"center",gap:4}}><div style={{width:7,height:7,borderRadius:"50%",background:f.color}}/><span style={{fontSize:9,color:t.dim}}>{f.name}</span></div>)}
            </div>
          </>}
        </div>
      </div>
      {modal&&<EventModal event={modal==="add"?null:modal} sel={sel} onClose={()=>setModal(null)} onSave={saveEvent} onDelete={deleteEvent}/>}
    </div>
  </ThemeCtx.Provider>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Homelight/>);
</script>
</body>
</html>
